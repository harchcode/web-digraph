<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Paper Background -->
  <rect x="1" y="1" width="98" height="98" rx="16" fill="#fdfcf8" stroke="#d6d3d1" stroke-width="2" />
  
  <!-- Edges (drawn behind shapes) -->
  <line x1="30" y1="25" x2="75" y2="45" stroke="#57534e" stroke-width="2" />
  <line x1="75" y1="45" x2="45" y2="80" stroke="#57534e" stroke-width="2" />
  <line x1="45" y1="80" x2="30" y2="25" stroke="#57534e" stroke-width="2" />

  <!-- Circle -->
  <circle cx="30" cy="25" r="10" fill="#bfdbfe" stroke="#1c1917" stroke-width="2" />
  
  <!-- Square -->
  <rect x="65" y="35" width="20" height="20" rx="2" fill="#fecaca" stroke="#1c1917" stroke-width="2" />
  
  <!-- Triangle -->
  <polygon points="45,69 35,86 55,86" fill="#bbf7d0" stroke="#1c1917" stroke-width="2" stroke-linejoin="round" />
</svg>
